name: Instagram Auto-Post Scheduler

on:
  schedule:
    - cron: '*/15 * * * *'   # Checks every 15 minutes
  workflow_dispatch:           # Allows manual trigger from GitHub UI

permissions:
  contents: write             # Needed to commit queue.json status updates

jobs:
  post-scheduled:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run post scheduler
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: python post_scheduler.py

      - name: Commit queue status updates
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "InstaFlow Bot"
          git add queue.json || true
          git diff --cached --quiet || git commit -m "🤖 Update queue.json after posting"
          git push || true
